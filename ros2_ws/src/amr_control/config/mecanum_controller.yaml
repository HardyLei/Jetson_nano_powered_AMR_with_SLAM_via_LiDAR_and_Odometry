mecanum_controller:
  ros__parameters:
    wheel_radius: 0.04
    wheel_base_x: 0.0825
    wheel_base_y: 0.1031
    cmd_vel_topic: /cmd_vel
    wheel_speed_topic: /wheel_speed_cmd
    # Initial bring-up limits. Verify with the wheels lifted.
    max_linear_speed: 0.15
    max_angular_speed: 0.5
    cmd_vel_timeout_sec: 0.25
