odometry_node:
  ros__parameters:
    wheel_radius: 0.04
    wheel_base_x: 0.0825
    wheel_base_y: 0.1031
    ticks_per_revolution: 660
    encoder_topic: /encoder_ticks
    odometry_topic: /odom
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    max_dt_sec: 0.5
    # Provisional variance estimates in x, y, z, roll, pitch, yaw order.
    pose_covariance_diagonal: [0.04, 0.04, 1000.0, 1000.0, 1000.0, 0.09]
    twist_covariance_diagonal: [0.02, 0.04, 1000.0, 1000.0, 1000.0, 0.04]
