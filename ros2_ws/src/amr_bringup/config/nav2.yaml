amcl:
  ros__parameters:
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    tf_broadcast: true
    set_initial_pose: false
    update_min_d: 0.08
    update_min_a: 0.12
    laser_max_range: 8.0

map_server:
  ros__parameters:
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # Libraries referenced by Humble's default goal and through-poses trees.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node

controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      # Conservative first-run limits. Confirm the motors can move at these speeds.
      min_vel_x: -0.08
      max_vel_x: 0.12
      min_vel_y: -0.10
      max_vel_y: 0.10
      max_vel_theta: 0.45
      min_speed_xy: 0.0
      max_speed_xy: 0.12
      min_speed_theta: 0.0
      acc_lim_x: 0.25
      acc_lim_y: 0.25
      acc_lim_theta: 0.8
      decel_lim_x: -0.35
      decel_lim_y: -0.35
      decel_lim_theta: -1.0
      vx_samples: 9
      vy_samples: 9
      vtheta_samples: 13
      sim_time: 1.5
      linear_granularity: 0.03
      angular_granularity: 0.05
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.02
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.05
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 8.0
      publish_frequency: 3.0
      transform_tolerance: 0.3
      # Bounds from the assembled URDF meshes with margin. Measure on the real AMR.
      footprint: "[[0.15, 0.14], [0.15, -0.14], [-0.15, -0.14], [-0.15, 0.14]]"
      footprint_padding: 0.01
      plugins: [obstacles, inflation]
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: lidar
        lidar:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          expected_update_rate: 0.8
          obstacle_min_range: 0.12
          obstacle_max_range: 3.5
          raytrace_min_range: 0.12
          raytrace_max_range: 4.0
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      update_frequency: 3.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      footprint: "[[0.15, 0.14], [0.15, -0.14], [-0.15, -0.14], [-0.15, 0.14]]"
      footprint_padding: 0.01
      track_unknown_space: true
      plugins: [static_map, obstacles, inflation]
      static_map:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: lidar
        lidar:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          expected_update_rate: 0.8
          obstacle_min_range: 0.12
          obstacle_max_range: 3.5
          raytrace_min_range: 0.12
          raytrace_max_range: 4.0
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.32
        cost_scaling_factor: 5.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.20
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_link
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    max_rotational_vel: 0.45
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8

velocity_smoother:
  ros__parameters:
    odom_topic: /odom
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: true
    max_velocity: [0.12, 0.10, 0.45]
    min_velocity: [-0.08, -0.10, -0.45]
    max_accel: [0.25, 0.25, 0.8]
    max_decel: [-0.35, -0.35, -1.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3
