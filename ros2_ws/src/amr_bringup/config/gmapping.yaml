slam_gmapping:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    transform_publish_period: 0.05
    tf_delay: 0.10
    map_update_interval: 1.0

    # X3 scan limit and initial usable range, in meters.
    autoRange: false
    maxRange: 8.0
    maxUrange: 7.9
    delta: 0.05
    # Start with a 20 m square to limit allocation. GMapping grows the map.
    xmin: -10.0
    ymin: -10.0
    xmax: 10.0
    ymax: 10.0
    linearUpdate: 0.20
    angularUpdate: 0.15
    temporalUpdate: 1.0
    particles: 30
